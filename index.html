    <script>
      (function() {
        // High version to enable all features
        var highVersion = '10.0';
        var mockStorage = {
          setItem: function(k, v, cb) { if(cb) cb(null, true); return this; },
          getItem: function(k, cb) { if(cb) cb(null, null); return this; },
          getItems: function(ks, cb) { if(cb) cb(null, {}); return this; },
          removeItem: function(k, cb) { if(cb) cb(null, true); return this; },
          removeItems: function(ks, cb) { if(cb) cb(null, true); return this; },
          getKeys: function(cb) { if(cb) cb(null, []); return this; }
        };

        function applyPatch() {
          try {
            window.Telegram = window.Telegram || {};
            window.Telegram.WebApp = window.Telegram.WebApp || {};
            var wa = window.Telegram.WebApp;
            
            // Mock version and methods if they are missing or low
            if (!wa.version || parseFloat(wa.version) < 6.1) {
              try {
                Object.defineProperty(wa, 'version', { 
                  get: function() { return highVersion; },
                  set: function() {},
                  configurable: true 
                });
              } catch(e) { wa.version = highVersion; }
            }

            if (!wa.isVersionAtLeast) {
              wa.isVersionAtLeast = function() { return true; };
            }

            if (!wa.CloudStorage) {
              wa.CloudStorage = mockStorage;
            }

            if (wa.initDataUnsafe && !wa.initDataUnsafe.user) {
               // Optional: Mock user for testing if needed
            }
          } catch(e) {
            console.error("Patch error:", e);
          }
        }

        applyPatch();
        // Periodically re-apply in case SDK re-initializes
        var patchTimer = setInterval(applyPatch, 1000);
        setTimeout(function() { clearInterval(patchTimer); }, 10000);

        // Simple console filter for specific Telegram warnings
        var _warn = console.warn;
        console.warn = function() {
          if (arguments[0] && typeof arguments[0] === 'string' && arguments[0].indexOf('CloudStorage') !== -1) return;
          _warn.apply(console, arguments);
        };
      })();
    </script>
